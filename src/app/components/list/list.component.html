
<app-add-edit-dialog
[(visible)]="visible"
[task]="task"
[btnText]="btnText"
[taskId]="taskId"
[dialogTitle]="dialogTitle"
></app-add-edit-dialog>

<p-confirmDialog></p-confirmDialog>

<app-user-actions
[isValidUser]="isValidUser"
></app-user-actions>


<p-table [value]="tasks$ | async" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template pTemplate="header">
      <tr>
        <th>Title</th>
        <th>Description</th>
        <th>Created At</th>
        <th>Status</th>
        <th>Actions</th>
      </tr>
    </ng-template>
    <ng-template pTemplate="body" let-task>
      <tr>
        <td>{{ task.title }}</td>
        <td>{{ task.description }}</td>
        <td>{{ task.createdAt | date : "medium" }}</td>
        <td>
          <p-tag
            [value]="task.status"
            [severity]="getSeverity(task.status)"
          ></p-tag>
        </td>
        <td>
          <button
            pButton
            icon="pi pi-pencil"
            class="p-button-sm p-button-rounded p-button-text"
            (click)="editTask(task)"
            tooltip="Edit"
          >
            Edit
          </button>
          <button
            pButton
            icon="pi pi-trash"
            class="p-button-sm p-button-rounded p-button-text p-button-danger"
            (click)="confirmDelete(task?._id)"
            tooltip="Delete"
          >
            Delete
          </button>
        </td>
      </tr>
    </ng-template>
  </p-table>
